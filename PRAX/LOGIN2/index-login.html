<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <li></li> 

        <div class="login-container">
            <h2>Your logo</h2>
            <h3>Login</h3>

            <form action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="user@gmail.com" required>  <!--required, povinne pole-->

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>

                <a href="#">Forgot Password?</a>

                <button type="submit">Sign in</button>

                <p>or continue with</p>

                <div class="social">
                    <button class="google">G</button>
                    <button class="github">GH</button>
                    <button class="facebook">F</button>
                </div>

                <p>Don’t have an account yet? <a href="#">Register for free</a></p>
            </form>
        </div>
    </div>
   
</body>
</html>
