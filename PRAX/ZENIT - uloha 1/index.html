<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Jednoduchý Carousel</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        .container{
            display: flex;
            align-items: center;
            gap: 20px;
        }

        button{
            background-color: white;
            color: black;
            border: 2px solid black;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .container-carousel {
            width: 300px;
            height: 300px;
            position: relative;
        }

        .box {
            width: 300px;
            height: 300px;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        .show {
            display: block;
        }

        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .black { background-color: black; }

        .container-dot {
            margin-top: 20px;
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid black;
            display: inline-block;
        }

        .active-dot {
            width: 12px;
            height: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="prevBtn">Predchádzajúci</button>

        <div class="container-carousel">
            <div class="box red show"></div>
            <div class="box blue"></div>
            <div class="box green"></div>
            <div class="box yellow"></div>
            <div class="box black"></div>
        </div>

        <button id="nextBtn">Nasledujúci</button>
    </div>

    <div class="container-dot">
        <span class="dot active-dot red"></span>
        <span class="dot blue"></span>
        <span class="dot green"></span>
        <span class="dot yellow"></span>
        <span class="dot black"></span>
    </div>

    <script>
        var boxes = document.getElementsByClassName("box");
        var dots = document.getElementsByClassName("dot");
        var prevBtn = document.getElementById("prevBtn");
        var nextBtn = document.getElementById("nextBtn");

        var currentIndex = 0;

        function showBox(index) {
            for (var i = 0; i < boxes.length; i++){
                boxes[i].classList.remove("show");
                dots[i].classList.remove("active-dot");
            }
            boxes[index].classList.add("show");
            dots[index].classList.add("active-dot");
        }

        nextBtn.onclick = function() {
            currentIndex = currentIndex + 1;
            
            if (currentIndex >= boxes.length) {
                currentIndex = 0;
            }
            showBox(currentIndex);
        };

        prevBtn.onclick = function() {
            currentIndex = currentIndex - 1;
            
            if (currentIndex < 0) {
                currentIndex = boxes.length - 1;
            }
            showBox(currentIndex);
        };

        document.onkeydown = function(event) {
            if (event.key === "ArrowRight") {
                currentIndex = currentIndex + 1;
                if (currentIndex >= boxes.length) {
                    currentIndex = 0;
                }
                showBox(currentIndex);
            } 
            else if (event.key === "ArrowLeft") {
                currentIndex = currentIndex - 1;
                if (currentIndex < 0) {
                    currentIndex = boxes.length - 1;
                }
                showBox(currentIndex);
            } 
            else if (event.key === "Home") {
                currentIndex = 0;
                showBox(currentIndex);
            } 
            else if (event.key === "End") {
                currentIndex = boxes.length - 1;
                showBox(currentIndex);
            }
        };
    </script>
</body>
</html>
