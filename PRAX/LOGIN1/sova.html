<!DOCTYPE html5>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sova.css">
    <title>Owl</title>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h2>Your Logo</h2>
            <h3>Login</h3>

            <form action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="username@gmail.com" required>

                <label for="password">Heslo</label>
                <div class="password-container">
                    <input type="checkbox" id="toggle-password">
                    <input type="password" id="password" name="password" placeholder="Heslo" required>
                    <label for="toggle-password" class="toggle-password"></label>
                </div>
                
                <label for="confirm-password">Potvrdiť heslo</label>
                <div class="password-container">
                    <input type="checkbox" id="toggle-confirm-password">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Potvrdiť heslo" required>
                    <label for="toggle-confirm-password" class="toggle-password"></label>
                </div>

                <a href="#">Zabudnuté heslo?</a>

                <button type="submit">Prihlásiť sa</button>

                <p>alebo pokračujte cez</p>

                <div class="social">
                    <button class="google">
                        <img src="obrazky/flat-color-icons--google.svg" alt="Google">
                    </button>
                    <button class="github">
                        <img src="obrazky/skill-icons--github-light.svg" alt="GitHub">
                    </button>
                    <button class="facebook">
                        <img src="obrazky/logos--facebook.svg" alt="Facebook">
                    </button>
                </div>

                <p class="register-text">Nemáte ešte účet? <a href="#" class="bold-text">Zaregistrujte sa zadarmo</a></p>
            </form>
        </div>

        <div class="image"></div> <!-- Sovička na PRAVEJ strane -->
    </div>
</body>
</html>
